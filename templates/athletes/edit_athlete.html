```templates/athletes/edit_athlete.html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Athlete</title>
</head>
<body>
    <h1>Edit Athlete Stats for {{ athlete.name }}</h1>
    <form action="{{ url_for('edit_athlete', athlete_id=athlete.id) }}" method="POST">
        
        <div>
            <label for="team_id">Select Team:</label>
            <select name="team_id" id="team_id" required>
                <option value="">Select a Team</option>
                {% for team in teams %}
                    <option value="{{ team.id }}" {% if athlete.team_id == team.id %}selected{% endif %}>{{ team.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        
        <div>
            <label for="points_per_game">Points Per Game:</label>
            <input type="number" step="0.01" id="points_per_game" name="points_per_game" value="{{ athlete.points_per_game }}" required>
        </div>
        <div>
            <label for="rebounds_per_game">Rebounds Per Game:</label>
            <input type="number" step="0.01" id="rebounds_per_game" name="rebounds_per_game" value="{{ athlete.rebounds_per_game }}" required>
        </div>
        <div>
            <label for="assists_per_game">Assists Per Game:</label>
            <input type="number" step="0.01" id="assists_per_game" name="assists_per_game" value="{{ athlete.assists_per_game }}" required>
        </div>
        <div>
            <label for="blocks_per_game">Blocks Per Game:</label>
            <input type="number" step="0.01" id="blocks_per_game" name="blocks_per_game" value="{{ athlete.blocks_per_game }}" required>
        </div>
        <div>
            <label for="steals_per_game">Steals Per Game:</label>
            <input type="number" step="0.01" id="steals_per_game" name="steals_per_game" value="{{ athlete.steals_per_game }}" required>
        </div>
        <div>
            <label for="field_goal_percentage">Field Goal Percentage:</label>
            <input type="number" step="0.01" id="field_goal_percentage" name="field_goal_percentage" value="{{ athlete.field_goal_percentage }}" required>
        </div>
        <div>
            <label for="three_point_percentage">Three Point Percentage:</label>
            <input type="number" step="0.01" id="three_point_percentage" name="three_point_percentage" value="{{ athlete.three_point_percentage }}" required>
        </div>
        <div>
            <label for="free_throw_percentage">Free Throw Percentage:</label>
            <input type="number" step="0.01" id="free_throw_percentage" name="free_throw_percentage" value="{{ athlete.free_throw_percentage }}" required>
        </div>
        <button type="submit">Update Stats</button>
    </form>
    <a href="{{ url_for('manage_athletes') }}">Back to Manage Athletes</a>
</body>
</html>
