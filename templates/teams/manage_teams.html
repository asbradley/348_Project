<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        body { font-family: Arial, sans-serif; }
        .menu-button {
          display: block;
          margin: 10px 0;
          padding: 10px 20px;
          background-color: #3498db;
          color: white;
          border: none;
          border-radius: 5px;
          cursor: pointer;
          text-decoration: none;
          width: 200px;
          text-align: center;
        }

        .action-buttons {
            display: block;
            margin: 10px 0;
            padding: 10px 20px;
            background-color: #e7e7e7; 
            color: black;
            width: 100px;
            cursor: pointer;
            text-align: center;
            
        }
        table {
            width: 80%;
            max-width: 800px;
            border-collapse: collapse;
            margin-top: 20px auto;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Manage Teams</h1>
    <p>This is where you'll manage teams.</p>


    <!-- Athlete Management Table -->
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>City</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for team in teams %}
            <tr>
                <td>{{ team.name }}</td>
                <td>{{ team.city }}</td>
                <td>
                    <form action="{{ url_for('delete_team', team_id=team.id) }}" method="POST" style="display:inline;">
                        <button type="submit" onclick="return confirm('Are you sure you want to delete this team?');" class="action-buttons">Delete</button>
                    </form>
                </td>

            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="{{ url_for('add_team') }}" class="menu-button">Add Team</a>

    <a href="{{ url_for('welcome') }}" class="menu-button">Back to Main Menu</a>
</body>
</html>
